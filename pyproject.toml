[build-system]
requires = ["setuptools>=75"]
build-backend = "cubic_build_backend"
backend-path = ["tools"]

[project]
name = "cubic-serve"
dynamic = ["version"]
description = "Correctness-first multimodal generative inference serving engine"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "backports.strenum==1.3.1; python_version < '3.11'",
    "cuda-bindings>=13.0.3,<14",
    "gguf==0.19.0",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.3.5; python_version >= '3.11'",
    "pillow==12.1.1",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "triton==3.7.1",
    "typing-extensions>=4.10,<5",
    "httptools==0.8.0",
    "uvloop==0.22.1",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
xgrammar = ["xgrammar==0.2.8"]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.12", "twine>=6,<7"]

[project.scripts]
cubic = "cubic_serve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cubic_serve = ["py.typed", "quantization/common/marlin/native/**/*",
               "quantization/common/marlin/native/*", "ops/cuda/**/*.cu", "ops/cuda/**/*.cuh",
               "ops/cuda/*.cuh", "quantization/common/*.cu",
               "quantization/common/small_rows.LICENSE", "quantization/extensions/*/*.cu",
               "quantization/extensions/*/*.cuh", "quantization/extensions/*/upstream/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cubic_serve"]
